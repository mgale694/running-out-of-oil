[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "running-out-of-oil"
version = "0.1.0"
description = "Reproducible evidence on oil reserves, field decline and supply timing"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
figures = ["matplotlib>=3.7,<4"]

[tool.setuptools.packages.find]
where = ["src"]
